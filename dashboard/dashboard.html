<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabStick Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-left">
      <img src="../assets/icons/icon48.png" alt="TabStick" class="header-logo">
      <h1>TabStick</h1>
    </div>
    <nav class="header-nav" id="view-tabs">
      <button class="nav-tab active" data-view="all-notes">All Notes</button>
      <button class="nav-tab" data-view="by-site">By Site</button>
      <button class="nav-tab" data-view="stats">Stats</button>
    </nav>
    <div class="header-actions">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" class="search-input" placeholder="Search notes...">
        <button id="clear-search-btn" class="clear-search-btn" style="display:none;" aria-label="Clear search">✕</button>
      </div>
      <button id="select-all-btn" class="toolbar-btn" style="display:none;">Select All</button>
      <button id="expand-all-btn" class="toolbar-btn" style="display:none;">Expand All</button>
      <button id="collapse-all-btn" class="toolbar-btn" style="display:none;">Collapse All</button>
      <div class="filter-wrap">
        <button id="filter-btn" class="toolbar-btn">Filter by color ▾</button>
        <div id="filter-dropdown" class="filter-dropdown" style="display:none;">
          <button class="filter-opt selected" data-color="all">All colors</button>
          <button class="filter-opt multi-color" data-color="sunflower"><span class="dot" style="background:#F9A825"></span>Sunflower</button>
          <button class="filter-opt multi-color" data-color="peach"><span class="dot" style="background:#F4511E"></span>Peach</button>
          <button class="filter-opt multi-color" data-color="mint"><span class="dot" style="background:#558B2F"></span>Mint</button>
          <button class="filter-opt multi-color" data-color="sky"><span class="dot" style="background:#0277BD"></span>Sky</button>
          <button class="filter-opt multi-color" data-color="lavender"><span class="dot" style="background:#6A1B9A"></span>Lavender</button>
          <button class="filter-opt multi-color" data-color="rose"><span class="dot" style="background:#C2185B"></span>Rose</button>
          <button class="filter-opt multi-color" data-color="slate"><span class="dot" style="background:#455A64"></span>Slate</button>
          <button class="filter-opt multi-color" data-color="cream"><span class="dot" style="background:#F0EAD0"></span>Cream</button>
        </div>
      </div>
      <div class="sort-wrap filter-wrap">
        <button id="sort-btn" class="toolbar-btn">Sort: Newest ▾</button>
        <div id="sort-dropdown" class="filter-dropdown sort-dropdown" style="display:none;">
          <button class="sort-opt" data-sort="newest">Newest</button>
          <button class="sort-opt" data-sort="oldest">Oldest</button>
          <button class="sort-opt" data-sort="az">A-Z</button>
          <button class="sort-opt" data-sort="site">Site</button>
        </div>
      </div>
      <div class="export-wrap" style="position:relative;">
        <button id="export-btn" class="toolbar-btn">Export All ▾</button>
        <div id="export-dropdown" class="filter-dropdown export-dropdown" style="display:none;">
          <button id="export-json" class="filter-opt">Export as JSON</button>
          <button id="export-md" class="filter-opt">Export as Markdown</button>
          <button id="export-txt" class="filter-opt">Export as Text</button>
        </div>
      </div>
      <button id="import-btn" class="toolbar-btn">Import</button>
      <input type="file" id="dashboard-file-import" accept=".json" style="display:none;">
    </div>
  </header>

  <!-- Floating Action Bar -->
  <div id="multi-action-bar" class="multi-action-bar">
    <span id="multi-count">0 selected</span>
    <div class="multi-actions">
      <button id="multi-delete-btn" class="toolbar-btn multi-btn danger">Delete</button>
      <button id="multi-export-btn" class="toolbar-btn multi-btn">Export</button>
      <button id="multi-close-btn" class="toolbar-btn multi-btn icon-only">✕</button>
    </div>
  </div>

  <main class="main-content">
    <!-- View: All Notes -->
    <div id="view-all-notes" class="view-container active">
      <div id="loading-skeleton" class="card-grid" style="display:none;">
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>
      <div id="all-notes-grid" class="view-content"></div>
    </div>

    <!-- View: By Site -->
    <div id="view-by-site" class="view-container">
      <div id="by-site-list" class="view-content"></div>
    </div>

    <!-- View: Stats -->
    <div id="view-stats" class="view-container">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val" id="stat-total-notes">0</div><div class="stat-lbl">Total Notes</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-total-sites">0</div><div class="stat-lbl">Total Sites</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-this-week">0</div><div class="stat-lbl">This Week</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-top-color">-</div><div class="stat-lbl">Top Color</div></div>
      </div>

      <div class="stats-pills">
        <span class="stat-pill">📌 Pinned: <strong id="stat-pinned">0</strong></span>
        <span class="stat-pill">👁️ Minimized: <strong id="stat-minimized">0</strong></span>
      </div>

      <div class="stats-two-col">
        <div class="stats-panel">
          <h2 class="panel-title">Activity Heatmap (30 Days)</h2>
          <div id="heatmap-grid" class="heatmap-grid"></div>
          <div id="heatmap-tooltip" class="heatmap-tooltip"></div>
        </div>
        <div class="stats-panel">
          <h2 class="panel-title">Color Distribution</h2>
          <div id="color-distro" class="color-distro"></div>
        </div>
      </div>

      <div class="stats-panel">
        <h2 class="panel-title">Most Active Sites</h2>
        <div id="active-sites-list" class="active-sites-list"></div>
      </div>
    </div>

    <!-- Shared Empty State -->
    <div id="empty-state" class="empty-state" style="display:none;">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:0.25; margin-bottom:16px;">
        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
        <path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path>
      </svg>
      <p style="margin:0 0 12px 0; font-size:15px; color:#9E9E9E; font-weight:500;">No notes found</p>
      <p style="margin:0; font-size:13px; color:#BDBDBD; max-width:280px; margin:0 auto; line-height:1.5;">Try a different search, or add your first note by clicking the TabStick icon in your toolbar.</p>
    </div>
  </main>

  <script src="../utils/colorThemes.js"></script>
  <script src="../utils/urlUtils.js"></script>
  <script src="../utils/idUtils.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
